# CUH settings. Server count and run duration are entered at startup.
random_seed = 412
arrival_probability = 0.5
arrival_batch_min = 1
arrival_batch_max = 3
service_cycles_min = 10
service_cycles_max = 100
scale_cooldown_cycles = 50
log_mode = quiet
log_path = logs/cuh-run.txt
console_color = true
bonus_mode = true

# Inclusive requester-IP ranges. Repeat this key for multiple rules.
blocked_range = 10.0.0.0-10.255.255.255
blocked_range = 192.168.0.0-192.168.255.255
